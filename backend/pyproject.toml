[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "castle-qa"
version = "0.1.0"
description = "CASTLE QA Studio - AI video understanding and question answering system"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic>=2.8,<3.0",
    "SQLAlchemy>=2.0,<2.1",
    "alembic>=1.13,<2.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0,<2",
    "Pillow>=10",
    "numpy>=1.26",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic>=2.8,<3.0",
    "SQLAlchemy>=2.0,<2.1",
    "alembic>=1.13,<2.0",
    "python-multipart>=0.0.9",
]
gpu = [
    "torch>=2.4.0",
    "torchvision",
    "transformers>=4.49.0",
    "accelerate>=1.0",
    "safetensors>=0.5",
    "av>=14",
    "qwen-vl-utils",
]
dev = [
    "pytest>=8,<10",
    "httpx",
]

[project.scripts]
castle-worker = "castle_qa.workers.entrypoint:main"
castle-api = "castle_qa.api.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 88
target-version = "py310"

