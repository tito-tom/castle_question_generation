
# =========================================
# CASTLE QA Studio - Alembic Configuration
# =========================================

[alembic]

# Directory containing migration environment
# and versioned migration scripts.
script_location = %(here)s/alembic

# Allow imports from the repository root.
prepend_sys_path = .

# Use UTF-8 for generated migration files.
output_encoding = utf-8

# Database connectivity will be configured
# in alembic/env.py using our existing
# SQLAlchemy engine and CASTLE_JOB_DB_PATH.
