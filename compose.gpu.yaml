# ============================================================
# CASTLE QA Studio - NVIDIA GPU Deployment Override for Lab PC
# Usage:
#   docker compose -f compose.yaml -f compose.gpu.yaml up -d
# ============================================================

services:
  worker:
    environment:
      VIDEO_UNDERSTANDING_MODE: real
      VIDEO_MODEL_NAME: ${VIDEO_MODEL_NAME:-Qwen/Qwen2.5-VL-7B-Instruct}
      VIDEO_FPS: ${VIDEO_FPS:-2.0}
      MAX_NEW_TOKENS: ${MAX_NEW_TOKENS:-1024}
      HF_HOME: /root/.cache/huggingface
      HF_HUB_CACHE: /root/.cache/huggingface/hub
      TRANSFORMERS_CACHE: /root/.cache/huggingface
      TORCH_HOME: /root/.cache/torch
    volumes:
      - ./data/videos:/app/data/videos:ro
      - model_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  model_cache:
    name: castle_qa_model_cache

